<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/red-mode.css">
    <!-- <link rel="stylesheet" href="styles/pink-mode.css"> -->
    <link rel="stylesheet" href="styles/dark-mode.css">
</head>
<body>

    <div class="whole-box">
        <div class="steps-box">

            <label class="theme-switcher">
                <input type="checkbox">
                <span class="slider"></span>
            </label>

            <div class="steps">
                <div class="steps-list">
                    <div class="step-number step-1-number" data-page="step1">1</div>
                    <div class="step-info">
                        <h5 class="step-info-step">STEP 1</h5>
                        <p class="step-info-step-info">YOUR INFO</p>
                    </div>
                </div>
            </div>
    
            <div class="steps">
                <div class="steps-list">
                    <div class="step-number step-2-number" data-page="step2">2</div>
                    <div class="step-info">
                        <h5 class="step-info-step">STEP 2</h5>
                        <p class="step-info-step-info">SELECT PLAN</p>
                    </div>
                </div>
            </div>
    
            <div class="steps">
                <div class="steps-list">
                    <div class="step-number step-3-number" data-page="step3">3</div>
                    <div class="step-info">
                        <h5 class="step-info-step">STEP 3</h5>
                        <p class="step-info-step-info">ADD-ONS</p>
                    </div>
                </div>
            </div>
    
            <div class="steps">
                <div class="steps-list">
                    <div class="step-number step-4-number" data-page="step4">4</div>
                    <div class="step-info">
                        <h5 class="step-info-step">STEP 4</h5>
                        <p class="step-info-step-info">SUMMARY</p>
                    </div>
                </div>
            </div>
        </div>
    
    
        <!--STEP ONE DISPLAY-->
        <div class="form-box step-1-box">
        </div>

        <!--STEP TWO DISPLAY-->
        <div class="form-box step-2-box">
        </div>

        <!--STEP THREE DISPLAY-->
        <div class="form-box step-3-box">
        </div>

        <!--STEP FOUR DISPLAY-->
        <div class="form-box step-4-box">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
